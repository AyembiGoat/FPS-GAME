<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        /* Keeps white text readable over sunlit concrete. */
        text-shadow:
          0 0 2px rgb(0 0 0 / 80%),
          0 1px 3px rgb(0 0 0 / 60%);
      }
      #crosshair {
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -3px;
        border: 1px solid rgb(0 0 0 / 70%);
        border-radius: 50%;
        background: #fff;
      }
      #hit-marker {
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        margin: -14px;
      }
      #targets {
        left: 24px;
        top: 20px;
        font-size: 15px;
      }
      #ammo {
        right: 28px;
        bottom: 22px;
        text-align: right;
      }
      #rounds {
        font-size: 30px;
        font-weight: 600;
      }
      #weapon-name {
        font-size: 14px;
      }
      /* The pause screen, shown whenever the mouse is not captured during a run. */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        background: rgb(0 0 0 / 60%);
        cursor: pointer;
      }
      #overlay > div {
        text-align: center;
      }
      #overlay h1 {
        margin: 0 0 20px;
        font-size: 34px;
        font-weight: 600;
      }
      #pause-controls {
        margin-bottom: 24px;
        text-align: left;
      }
      #overlay p {
        margin: 0 0 16px;
        font-size: 17px;
      }
      .pause-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .pause-buttons button {
        padding: 9px 22px;
        border: 1px solid #fff;
        background: none;
        color: #fff;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      .pause-buttons button:hover {
        background: rgb(255 255 255 / 15%);
      }
      .pause-buttons button.primary {
        background: #fff;
        color: #111;
      }
      .notice {
        margin: 14px 0 0;
        color: #d8a35f;
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="crosshair" class="hud"></div>
    <svg id="hit-marker" class="hud" viewBox="0 0 28 28" hidden>
      <path
        d="M4 4l6 6M24 4l-6 6M4 24l6-6M24 24l-6-6"
        stroke="#fff"
        stroke-width="2"
        stroke-linecap="square"
      />
    </svg>
    <div id="targets" class="hud"></div>
    <div id="ammo" class="hud">
      <div id="rounds"></div>
      <div id="weapon-name"></div>
    </div>
    <div id="overlay" hidden>
      <div>
        <h1>Paused</h1>
        <div id="pause-controls"></div>
        <p>Click anywhere, or Keep playing, to carry on.</p>
        <div class="pause-buttons">
          <button id="to-resume" type="button">Keep playing</button>
          <button id="to-menu" type="button">Back to menu</button>
        </div>
        <p id="pause-notice" class="notice" hidden>
          The browser did not give the game the mouse. Click again.
        </p>
      </div>
    </div>
    <div id="menu" hidden></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
