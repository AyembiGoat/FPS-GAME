<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
        user-select: none;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        /* Keeps white text readable over sunlit concrete. */
        text-shadow:
          0 0 2px rgb(0 0 0 / 80%),
          0 1px 3px rgb(0 0 0 / 60%);
      }
      #crosshair {
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -3px;
        border: 1px solid rgb(0 0 0 / 70%);
        border-radius: 50%;
        background: #fff;
      }
      #hit-marker {
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        margin: -14px;
      }
      #targets {
        left: 24px;
        top: 20px;
        font-size: 15px;
      }
      #ammo {
        right: 28px;
        bottom: 22px;
        text-align: right;
      }
      #rounds {
        font-size: 30px;
        font-weight: 600;
      }
      #weapon-name {
        font-size: 14px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(0 0 0 / 60%);
        cursor: pointer;
      }
      #overlay h1 {
        margin: 0 0 20px;
        font-size: 34px;
        font-weight: 600;
      }
      #overlay dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 6px 20px;
        margin: 0 0 24px;
        font-size: 15px;
      }
      #overlay dt {
        text-align: right;
        opacity: 0.7;
      }
      #overlay dd {
        margin: 0;
      }
      #overlay p {
        margin: 0;
        font-size: 17px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="crosshair" class="hud"></div>
    <svg id="hit-marker" class="hud" viewBox="0 0 28 28" hidden>
      <path
        d="M4 4l6 6M24 4l-6 6M4 24l6-6M24 24l-6-6"
        stroke="#fff"
        stroke-width="2"
        stroke-linecap="square"
      />
    </svg>
    <div id="targets" class="hud"></div>
    <div id="ammo" class="hud">
      <div id="rounds"></div>
      <div id="weapon-name"></div>
    </div>
    <div id="overlay">
      <div>
        <h1>Shoot House</h1>
        <dl>
          <dt>Move</dt>
          <dd>W A S D</dd>
          <dt>Look</dt>
          <dd>Mouse</dd>
          <dt>Fire</dt>
          <dd>Left click</dd>
          <dt>Aim</dt>
          <dd>Right click (hold)</dd>
          <dt>Lean</dt>
          <dd>Q and E (hold)</dd>
          <dt>Reload</dt>
          <dd>R</dd>
          <dt>Jump</dt>
          <dd>Space</dd>
          <dt>Sprint</dt>
          <dd>Left Shift</dd>
          <dt>Pause</dt>
          <dd>Esc</dd>
        </dl>
        <p>Click to play</p>
      </div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
